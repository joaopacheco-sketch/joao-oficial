<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenário 1 - Rua na chuva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;user-select:none}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1600px;height:900px;flex:none;overflow:hidden;background:#000;transform-origin:center center}
  #cam{position:absolute;inset:0;transform:scale(1.04);will-change:transform;isolation:isolate}
  #px,#fx,#rn,#ch{position:absolute;left:0;top:0;width:1600px;height:900px}
  #px,#rn,#ch{image-rendering:pixelated;image-rendering:crisp-edges}
  #nome{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:19px;font-weight:bold;letter-spacing:1px;color:#fff;text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000;pointer-events:none;white-space:nowrap}
  #px{filter:saturate(1.22) contrast(1.07) brightness(1.06)}
  #fx{mix-blend-mode:screen}
  #grade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(30,50,110,.20) 0%,rgba(30,50,110,0) 42%,rgba(110,45,20,.10) 100%)}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.62) 100%)}
  #fade{position:absolute;inset:0;background:#000;pointer-events:none;animation:fadeIn 2.6s ease-out forwards}
  @keyframes fadeIn{to{opacity:0;visibility:hidden}}
  #hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#cfd6e6;font-size:20px;letter-spacing:1px;text-shadow:2px 2px 0 #000;opacity:0;animation:hint 9s 2.8s ease-in-out forwards;pointer-events:none}
  @keyframes hint{0%{opacity:0}12%,80%{opacity:.85}100%{opacity:0}}
  #snd{position:absolute;right:26px;top:22px;font-family:inherit;font-size:20px;color:#fff;background:rgba(10,10,20,.55);border:3px solid #8d93b5;padding:10px 16px;cursor:pointer;z-index:5}
  #snd:hover{border-color:#ffd25a}

  /* ---------- CAIXA DE DIALOGO (estilo Chrono Trigger) ---------- */
  #dlg{position:absolute;left:110px;right:110px;top:92px;height:236px;z-index:6;opacity:0;transform:translateY(-34px);transition:opacity .25s,transform .25s;pointer-events:none}
  #dlg.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
  #dlgBox{position:absolute;inset:0;background:linear-gradient(180deg,#2d62d8 0%,#1a3da0 45%,#0b1b60 100%);border:6px solid #f4f1ff;border-radius:18px;
    box-shadow:0 0 0 4px #0a0f3a,inset 0 0 0 4px #5f80e6,inset 0 0 44px rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.65)}
  #dlgText{position:absolute;left:46px;right:46px;top:36px;bottom:30px;font-family:'Press Start 2P','Courier New',monospace;font-size:26px;line-height:1.9;color:#fff;text-shadow:3px 3px 0 #000;overflow:hidden}
  #dlgName{position:absolute;left:38px;top:-34px;padding:9px 22px 7px;font-family:'Press Start 2P','Courier New',monospace;font-size:21px;color:#ffe27a;letter-spacing:2px;text-shadow:3px 3px 0 #000;
    background:linear-gradient(180deg,#2d62d8,#1a3da0);border:5px solid #f4f1ff;border-radius:12px;box-shadow:0 0 0 3px #0a0f3a,inset 0 0 0 3px #5f80e6}
  #dlgArrow{position:absolute;right:48px;bottom:22px;font-size:26px;color:#fff;text-shadow:3px 3px 0 #000;display:none;animation:arrow .7s steps(1) infinite;font-family:'Press Start 2P','Courier New',monospace}
  @keyframes arrow{0%{transform:translateY(0)}50%{transform:translateY(9px)}}

  /* ---------- SETA "GO" (estilo luta antigo) ---------- */
  #goArrow{position:absolute;right:56px;top:440px;width:264px;height:176px;image-rendering:pixelated;image-rendering:crisp-edges;opacity:0;pointer-events:none;z-index:4;filter:drop-shadow(0 0 14px rgba(255,200,40,.75))}
  #goArrow.show{animation:goBlink 1s steps(1) infinite,goBob .45s steps(3) infinite alternate}
  @keyframes goBlink{0%,64%{opacity:1}65%,100%{opacity:0}}
  @keyframes goBob{from{transform:translateX(0)}to{transform:translateX(24px)}}
  #fase{position:absolute;inset:0;background:#000;z-index:7;opacity:0;pointer-events:none;transition:opacity .9s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;font-family:'Press Start 2P','Courier New',monospace;text-align:center}
  #fase.show{opacity:1;pointer-events:auto}
  #faseT{font-size:64px;color:#ffd25a;text-shadow:6px 6px 0 #6a3a00,0 0 30px rgba(255,190,40,.7)}
  #faseS{font-size:30px;color:#fff;text-shadow:4px 4px 0 #000}
  #faseH{font-size:18px;color:#9fb0e8;animation:blinkk 1s steps(1) infinite}
  @keyframes blinkk{50%{opacity:0}}
</style>
</head>
<body>
<div id="viewport">
 <div id="stage">
  <div id="cam">
    <canvas id="px" width="160" height="90"></canvas>
    <canvas id="ch" width="480" height="270"></canvas>
    <canvas id="rn" width="320" height="180"></canvas>
    <div id="nome">Maicon</div>
    <canvas id="fx" width="800" height="450"></canvas>
  </div>
  <div id="grade"></div>
  <div id="vig"></div>
  <button id="snd">SOM: DESLIGADO (M)</button>
  <div id="hint">W A S D = MOVER &nbsp;•&nbsp; SHIFT = CORRER &nbsp;•&nbsp; CLIQUE PARA LIGAR O SOM &nbsp;•&nbsp; M = SOM &nbsp;•&nbsp; F = TELA CHEIA</div>
  <div id="dlg"><div id="dlgBox"></div><div id="dlgName">Maicon</div><div id="dlgText"></div><div id="dlgArrow">&#9660;</div></div>
  <canvas id="goArrow" width="24" height="16"></canvas>
  <div id="fase"><div id="faseT">FASE 2</div><div id="faseS">A FÁBRICA</div><div id="faseH">APERTE ENTER PARA IR</div></div>
  <div id="fade"></div>
 </div>
</div>

function criarMaicon(cfg){
  const SW=33,SH=66,PAD=8,TWd=SW+PAD*2,THt=SH+PAD*2,CH=3;
  const keys={};
  const MOVE=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.shift=e.shiftKey;if(MOVE.includes(k)){keys[k]=true;e.preventDefault()}});
  addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.shift=e.shiftKey;keys[k]=false});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
  const sF=new Image(),sB=new Image();sF.src=cfg.sprF;sB.src=cfg.sprB;
  const tmpc=document.createElement('canvas');tmpc.width=TWd;tmpc.height=THt;
  const tg=tmpc.getContext('2d');tg.imageSmoothingEnabled=false;
  const hair={x:0,y:0,vx:0,vy:0};
  const approach=(v,t,s)=>v<t?Math.min(t,v+s):Math.max(t,v-s);
  const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));

  const M={x:cfg.x0,y:cfg.y0,vx:0,vy:0,dir:'down',moving:false,running:false,skid:false,ph:0,walked:0,pf:0,speed:0,peak:0,dustT:0,prevBob:0,P:null,

  /* pose = deslocamentos de cada parte do corpo em cada instante do ciclo */
  pose(dir,ph,mv,run,t,skid){
    const side=dir==='left'||dir==='right';
    const cyc=ph*6.2832,sn=Math.sin(cyc),f=side?Math.cos(cyc):sn;
    const P={side,dL:0,dR:0,oxL:0,oxR:0,bob:0,lean:0,aLdx:0,aLdy:0,aRdx:0,aRdy:0};
    if(skid){P.lean=side?-1:0;if(side){P.oxL=-3;P.oxR=3;P.aLdx=-2;P.aRdx=2}P.aLdy=P.aRdy=-1;return P}
    if(!mv){P.bob=(Math.sin(t*2.2)>.35)?1:0;return P}
    const U=run?4.6:3,D=side?0:(run?1.6:1);
    P.dL=f>0?-Math.round(f*U):Math.round(-f*D);
    P.dR=f<0?-Math.round(-f*U):Math.round(f*D);
    if(side){const A=run?6.5:5;P.oxL=Math.round(sn*A);P.oxR=-P.oxL}
    P.bob=Math.round(Math.abs(f)*(run?2.4:1.4));
    P.lean=side?(run?2:1):0;
    if(side){P.aLdx=Math.round(-sn*(run?3:2));P.aRdx=-P.aLdx;P.aLdy=P.aRdy=run?-1:0}
    else{P.aLdy=Math.round(f*(run?2.4:1.4));P.aRdy=-P.aLdy}
    return P},

  passo(lado){
    if(cfg.onStep)cfg.onStep(this.x+lado*1.7,this.y,this.running,lado);
    stepSound(this.running,cfg.stepLP||[1100,1700])},

  update(t,dt){
    const lock=cfg.locked&&cfg.locked();
    let dx=0,dy=0;const k=keys;
    if(!lock){dx=((k.d||k.arrowright)?1:0)-((k.a||k.arrowleft)?1:0);dy=((k.s||k.arrowdown)?1:0)-((k.w||k.arrowup)?1:0)}
    const has=!!(dx||dy);
    if(has){const l=Math.hypot(dx,dy);dx/=l;dy/=l}
    const maxS=(k.shift&&!lock)?cfg.runSpd:cfg.walkSpd,st=(has?cfg.accel:cfg.decel)*dt;
    this.vx=approach(this.vx,has?dx*maxS:0,st);this.vy=approach(this.vy,has?dy*maxS:0,st);
    let nx=this.x+this.vx*dt,ny=this.y+this.vy*dt;const b=cfg.bounds;
    if(nx<b[0]){nx=b[0];this.vx=0}if(nx>b[1]){nx=b[1];this.vx=0}if(ny<b[2]){ny=b[2];this.vy=0}if(ny>b[3]){ny=b[3];this.vy=0}
    const moved=Math.hypot(nx-this.x,ny-this.y);this.x=nx;this.y=ny;
    this.speed=Math.hypot(this.vx,this.vy);
    this.moving=this.speed>4;
    this.running=this.speed>cfg.walkSpd+(cfg.runSpd-cfg.walkSpd)*.45;
    if(has){this.peak=Math.max(this.peak,this.speed);
      if(Math.abs(dx)>Math.abs(dy))this.dir=dx>0?'right':'left';else if(dy!==0)this.dir=dy>0?'down':'up';else this.dir=dx>0?'right':'left'}
    else if(this.speed<8)this.peak=0;
    this.skid=!has&&this.peak>cfg.walkSpd*1.25&&this.speed>10;
    if(this.moving&&!this.skid){
      this.ph=(this.ph+moved/(this.running?15:11.5))%1;this.walked+=moved;
      const side=this.dir==='left'||this.dir==='right',f=side?Math.cos(this.ph*6.2832):Math.sin(this.ph*6.2832);
      if(this.pf>0&&f<=0)this.passo(-1);else if(this.pf<0&&f>=0)this.passo(1);
      this.pf=f}
    else if(!this.moving){this.ph*=Math.max(0,1-dt*10);this.pf=0}
    if(this.skid){this.dustT-=dt;if(this.dustT<=0){this.dustT=.045;if(cfg.onSkid)cfg.onSkid(this.x,this.y,this.dir)}}
    const P=this.P=this.pose(this.dir,this.ph,this.moving&&!this.skid,this.running,t,this.skid);
    /* cabelo com mola: balanca e demora para acompanhar o corpo */
    const bobV=(P.bob-this.prevBob)/Math.max(dt,.001);this.prevBob=P.bob;
    const tx=P.side?(this.skid?1.5:-(this.speed/cfg.runSpd)*2.4):0,ty=clampN(bobV*.03,-2,2);
    hair.vx+=(-260*(hair.x-tx)-20*hair.vx)*dt;hair.x=clampN(hair.x+hair.vx*dt,-3,3);
    hair.vy+=(-260*(hair.y-ty)-20*hair.vy)*dt;hair.y=clampN(hair.y+hair.vy*dt,-3,3)},

  compose(dir,P){
    const img=dir==='up'?sB:sF;
    const tdx=Math.round(P.lean/2),tdy=-P.bob,hdx=P.lean,hdy=-P.bob;
    const hrx=hdx+Math.round(hair.x),hry=hdy+Math.round(hair.y);
    tg.globalCompositeOperation='source-over';tg.clearRect(0,0,TWd,THt);
    /* pernas */
    tg.drawImage(img,9,46,8,7,PAD+9+P.oxL,PAD+46+P.dL,8,7);
    tg.drawImage(img,0,53,17,13,PAD+P.oxL,PAD+53+P.dL,17,13);
    tg.drawImage(img,17,46,7,7,PAD+17+P.oxR,PAD+46+P.dR,7,7);
    tg.drawImage(img,17,53,16,13,PAD+17+P.oxR,PAD+53+P.dR,16,13);
    /* ombros, tronco e quadril */
    tg.drawImage(img,6,33,21,2,PAD+6+tdx,PAD+33+tdy,21,2);
    tg.drawImage(img,11,35,11,14,PAD+11+tdx,PAD+35+tdy,11,14);
    /* bracos */
    tg.drawImage(img,3,35,8,14,PAD+3+P.aLdx,PAD+35+P.aLdy+tdy,8,14);
    tg.drawImage(img,22,35,9,14,PAD+22+P.aRdx,PAD+35+P.aRdy+tdy,9,14);
    /* cabeca e cabelo */
    tg.drawImage(img,0,16,33,17,PAD+hdx,PAD+16+hdy,33,17);
    tg.drawImage(img,0,0,33,22,PAD+hrx,PAD+hry,33,22)},

  draw(c,t,dt){
    this.update(t,dt);
    if(!sF.complete||!sF.naturalWidth||!sB.complete||!this.P)return;
    const P=this.P;this.compose(this.dir,P);
    const tints=cfg.tint?cfg.tint(this.x,this.y,t):[];
    tg.globalCompositeOperation='source-atop';tints.forEach(s=>{tg.fillStyle=s;tg.fillRect(0,0,TWd,THt)});tg.globalCompositeOperation='source-over';
    const side=P.side,fx_=Math.round(this.x*CH),fy=Math.round(this.y*CH),sx=side?.8:1,flip=this.dir==='left'?-1:1;
    c.fillStyle=`rgba(0,0,0,${cfg.shadowA||.42})`;c.beginPath();c.ellipse(fx_,fy-1,Math.max(6,12*sx+1-P.bob*.5),3.4,0,0,6.2832);c.fill();
    if(cfg.reflect&&cfg.reflect(this.y)){c.save();c.globalAlpha=cfg.reflA||.17;c.setTransform(flip*sx,0,0,-.6,fx_,fy);c.drawImage(tmpc,-TWd/2,-(PAD+SH),TWd,THt);c.restore()}
    c.save();c.setTransform(flip*sx,0,0,1,fx_,fy);c.drawImage(tmpc,-TWd/2,-(PAD+SH));c.restore();
    if(cfg.nomeEl){cfg.nomeEl.style.left=(this.x*10)+'px';cfg.nomeEl.style.top=((this.y-SH/CH-3.2-P.bob*.1)*10)+'px'}}
  };
  window.__compose=(d,ph,mv,run,sk)=>{const P=M.pose(d,ph,mv,run,0,!!sk);M.compose(d,P);return tmpc.toDataURL()};
  return M;
}

const maicon=criarMaicon({sprF:SPR_FRONT,sprB:SPR_BACK,nomeEl:$('nome'),x0:80,y0:82,bounds:[7,153,71,89],walkSpd:34,runSpd:64,accel:620,decel:860,
  locked:()=>travado||(typeof dlg!=='undefined'&&dlg.open),
  stepLP:[1100,1700],
  onStep(x,y,run){
    const n=run?6:3;for(let i=0;i<n;i++)splash.push({x:x+R(-.8,.8),y:y-.3,vx:R(-14,14)*(run?1.3:1),vy:-R(12,28)*(run?1.4:1),l:.26+Math.random()*.12});

    const gx=Math.round(x),gy=Math.round(y);if(gx>=0&&gx<LW&&gy>=0&&gy<LH&&pm[gy*LW+gx]&&ripples.length<28)ripples.push({x:gx,y:gy,a:0})},

const dlgEl=$('dlg'),dlgText=$('dlgText'),dlgName=$('dlgName'),dlgArrow=$('dlgArrow');
const dlg={open:false,pages:[],page:0,text:'',shown:0,acc:0,done:false,onEnd:null,cps:34,
  say(nome,pages,onEnd){dlgName.textContent=nome;this.pages=pages;this.page=0;this.onEnd=onEnd;this.open=true;dlgEl.classList.add('show');this.start()},
  start(){this.text=this.pages[this.page];this.shown=0;this.acc=0;this.done=false;dlgText.textContent='';dlgArrow.style.display='none'},
  tick(dt){
    if(!this.open||this.done)return;
    this.acc+=dt*this.cps;
    while(this.acc>=1&&this.shown<this.text.length){
      this.shown++;this.acc--;const ch=this.text[this.shown-1];
      if(ch!==' '&&this.shown%2===0)blip();
      if('.,?!'.includes(ch)&&this.shown<this.text.length&&this.text[this.shown]===' ')this.acc=-(ch==='.'?7:4)}
    dlgText.textContent=this.text.slice(0,this.shown);
    if(this.shown>=this.text.length){this.done=true;dlgArrow.style.display='block'}},
  advance(){
    if(!this.open)return;
    if(!this.done){this.shown=this.text.length;dlgText.textContent=this.text;this.done=true;dlgArrow.style.display='block';return}
    this.page++;
    if(this.page<this.pages.length){this.start();return}
    this.open=false;dlgEl.classList.remove('show');dlgArrow.style.display='none';if(this.onEnd)this.onEnd()}};
function blip(){if(!AC||!soundOn)return;try{const o=AC.createOscillator(),gn=AC.createGain();o.type='square';o.frequency.value=R(420,560);gn.gain.setValueAtTime(.05,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.05);o.connect(gn);gn.connect(master);o.start();o.stop(AC.currentTime+.06)}catch(e){}}

addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(dlg.open&&(k==='enter'||k===' '||k==='e')){e.preventDefault();dlg.advance()}});
let cenaN=0,esperaT=4.4,walkRef=0,limiteT=0;
function proxFala(){const s=SCRIPT[cenaN];dlg.say(s.nome,s.falas,()=>{cenaN++;if(cenaN<SCRIPT.length){walkRef=maicon.walked||0;limiteT=14}else mostrarGo()})}
/* seta GO (apontando para a proxima fase) */
const goEl=$('goArrow'),faseEl=$('fase');let goOn=false;
(function(){const c=goEl.getContext('2d'),W=24,H=16,fill=[];
  for(let y=0;y<H;y++){fill[y]=[];for(let x=0;x<W;x++){let on=false;
    if(x>=2&&x<=12&&y>=5&&y<=10)on=true;
    if(x>=11&&x<=21){const half=(21-x)/(21-11)*5.6+.4;if(Math.abs(y-7.5)<=half)on=true}
    fill[y][x]=on}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(fill[y][x]){const top=!(fill[y-1]&&fill[y-1][x]),top2=!(fill[y-2]&&fill[y-2][x]),bot=!(fill[y+1]&&fill[y+1][x]),bot2=!(fill[y+2]&&fill[y+2][x]);
      c.fillStyle=(top||top2)?'#fff0a0':(bot||bot2)?'#d98a14':'#ffd23c';c.fillRect(x,y,1,1)}
    else{let near=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(fill[y+dy]&&fill[y+dy][x+dx])near=true}
      if(near){c.fillStyle='#1a0a00';c.fillRect(x,y,1,1)}}}})();
function mostrarGo(){goOn=true;goEl.classList.add('show');blip();setTimeout(blip,120);setTimeout(blip,240)}
let irT=0;
function irFase2(){clearTimeout(irT);if(parent!==window)parent.postMessage({ir:'cenario2'},'*');else location.href='cenario2.html'}
function checaGo(){if(goOn&&!travado&&maicon.x>=151.5){travado=true;goOn=false;goEl.classList.remove('show');faseEl.classList.add('show');irT=setTimeout(irFase2,2800)}}
addEventListener('keydown',e=>{if(e.repeat)return;if(faseEl.classList.contains('show')&&e.key==='Enter'){e.preventDefault();irFase2()}});
function agendaFalas(dt){
  if(dlg.open||cenaN>=SCRIPT.length)return;
  if(cenaN===0){esperaT-=dt;if(esperaT<=0)proxFala()}
  else{limiteT-=dt;if(((maicon.walked||0)-walkRef)>=26||limiteT<=0)proxFala()}}



/* ---------- audio ---------- */
let AC=null,master=null,soundOn=false,asked=false;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const len=AC.sampleRate*4,buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.04*w)/1.04;d[i]=w*.5+l*5}}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=700;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7500;
  const gn=AC.createGain();gn.gain.value=.16;
  src.connect(hp);hp.connect(lp);lp.connect(gn);gn.connect(master);src.start();
  const src2=AC.createBufferSource();src2.buffer=buf;src2.loop=true;src2.playbackRate.value=.5;
  const lp2=AC.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=450;const g2=AC.createGain();g2.gain.value=.22;
  src2.connect(lp2);lp2.connect(g2);g2.connect(master);src2.start();
}
function thunder(delay){
  if(!AC||!soundOn)return;
  const t0=AC.currentTime+delay,len=AC.sampleRate*5,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.06*(Math.random()*2-1))/1.06;d[i]=l*9}
  const s=AC.createBufferSource();s.buffer=buf;const lp=AC.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(500,t0);lp.frequency.exponentialRampToValueAtTime(70,t0+4);
  const gn=AC.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(.9,t0+.12);gn.gain.exponentialRampToValueAtTime(.001,t0+4.6);
  s.connect(lp);lp.connect(gn);gn.connect(master);s.start(t0);s.stop(t0+5)}
function setSound(on){
  if(on){initAudio();if(!AC)return;AC.resume();master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(.85,AC.currentTime+1.2)}
  else if(AC){master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(0,AC.currentTime+.4)}
  soundOn=on;$('snd').textContent='SOM: '+(on?'LIGADO':'DESLIGADO')+' (M)'}
$('snd').addEventListener('click',e=>{e.stopPropagation();asked=true;setSound(!soundOn)});
addEventListener('pointerdown',()=>{if(!asked){asked=true;setSound(true)}});
addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){asked=true;setSound(!soundOn)}
  if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}
  });

function strike(){
  const pts=[];let x=R(25,135),y=0;pts.push([x,y]);
  while(y<18){y+=R(1.5,3.5);x+=R(-4,4);pts.push([x,y])}
  bolt={pts,age:0};flashT=0;flash=1;
  thunder(R(.5,1.9))}
window.__raio=strike;

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;const t=T;

  /* base */
  g.globalAlpha=1;g.drawImage(bc,0,0);
  dlg.tick(dt);agendaFalas(dt);checaGo();

  /* estrelas */
  stars.forEach(s=>{const a=.25+.75*Math.max(0,Math.sin(t*s.s+s.p));
    if(s.base){g.fillStyle='rgb(46,42,40)';g.fillRect(s.x,s.y,1,1)}
    g.fillStyle=`rgba(225,220,200,${a*(s.base?1:.8)})`;g.fillRect(s.x,s.y,1,1);
    if(s.base&&a>.9){g.fillStyle='rgba(225,220,200,.35)';g.fillRect(s.x-1,s.y,3,1);g.fillRect(s.x,s.y-1,1,3)}});

  /* lua */
  for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const d=Math.hypot(dx,dy);if(d<=4.4){const sh=dx*.5+dy*.4;g.fillStyle=sh>1.7?'rgb(160,156,142)':(((dx+dy)%5===0&&d<3)?'rgb(190,186,170)':'rgb(216,212,194)');g.fillRect(MOON.x+dx,MOON.y+dy,1,1)}}

  /* nuvens (recortadas pelo ceu) */
  c2.clearRect(0,0,LW,LH);
  let cover=0;
  [true,false].forEach(far=>{
    clouds.filter(b=>b.far===far).forEach(b=>{
      const x=cx_(b);
      c2.fillStyle=far?'#2f2c2a':'#232120';drawBlob(c2,b,x);
      c2.fillStyle=far?'#3f3a36':'#3a3531';c2.fillRect(Math.round(x-b.w*.28),Math.round(b.y-b.h),Math.round(b.w*.56),1);
      const k=1-(Math.pow((MOON.x-x)/(b.w/2),2)+Math.pow((MOON.y-b.y)/b.h,2));if(k>0)cover=Math.max(cover,Math.min(1,k*2.2))})});
  if(bolt){bolt.age+=dt;if(bolt.age<.32&&(Math.floor(bolt.age*40)%2===0||bolt.age<.1)){c2.strokeStyle='#f2f4ff';c2.lineWidth=1;c2.beginPath();bolt.pts.forEach((p,i)=>i?c2.lineTo(p[0],p[1]):c2.moveTo(p[0],p[1]));c2.stroke()}else if(bolt.age>=.32)bolt=null}
  c2.globalCompositeOperation='destination-in';c2.drawImage(sm,0,0);c2.globalCompositeOperation='source-over';
  g.globalAlpha=.92;g.drawImage(cc,0,0);g.globalAlpha=1;

  /* morcegos */
  batT-=dt;if(batT<=0){batT=R(18,34);const dir=Math.random()<.5?1:-1,n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)bats.push({x:dir>0?-8-i*9:LW+8+i*9,y:R(3,8)+i*1.5,v:dir*R(16,24),ph:R(0,6),dir})}
  for(let i=bats.length-1;i>=0;i--){const b=bats[i];b.x+=b.v*dt;b.y+=Math.sin(t*3+b.ph)*.12;
    if(b.x<-14||b.x>LW+14){bats.splice(i,1);continue}
    const up=Math.floor(t*9+b.ph)%2===0;g.fillStyle='#100e0e';const x=Math.round(b.x),y=Math.round(b.y);
    if(up){g.fillRect(x,y,1,1);g.fillRect(x+6,y,1,1);g.fillRect(x,y+1,2,1);g.fillRect(x+5,y+1,2,1);g.fillRect(x+2,y+1,3,1);g.fillRect(x+2,y+2,3,1)}
    else{g.fillRect(x+1,y,5,1);g.fillRect(x,y+1,2,1);g.fillRect(x+5,y+1,2,1);g.fillRect(x+2,y+1,3,1);g.fillRect(x,y+2,1,1);g.fillRect(x+6,y+2,1,1)}}

  /* janelas */
  tvCol=[(80+Math.random()*60)|0,(150+Math.random()*80)|0,255];
  if(Math.random()<.7)tvCol=mix(tvCol,[20,40,90],Math.random()*.6);
  wins.forEach(w=>{
    w.t-=dt;if(w.t<=0&&!w.tv){w.on=w.on?(Math.random()<.35?0:1):(Math.random()<.5?1:0);w.t=R(14,42)}
    w.lv+=Math.sign(w.on-w.lv)*Math.min(Math.abs(w.on-w.lv),dt*3.2);
    w.pts.forEach(p=>{g.fillStyle=rgb(mix(DARK,w.tv?tvCol:p.on,w.lv));g.fillRect(p.x,p.y,1,1)})});

  /* lampadas */
  LAMPS.forEach(L=>{updLamp(L,t,dt);L.pts.forEach(p=>{g.fillStyle=rgb(mix([120,98,54],p.c,L.lv));g.fillRect(p.x,p.y,1,1)})});

  /* neon */
  if(!NEON.fl&&t>NEON.next){NEON.fl=true;NEON.until=t+R(.4,1.1)}
  if(NEON.fl){const s=Math.floor(t*17);NEON.lv=((s*37)%7<3)?.18:(((s*13)%5<2)?.6:1);if(t>NEON.until){NEON.fl=false;NEON.next=t+R(6,15)}}
  else NEON.lv=.93+.07*Math.sin(t*23);
  NEON.pink.forEach(p=>{g.fillStyle=rgb(mix([80,28,58],p.c,NEON.lv));g.fillRect(p.x,p.y,1,1)});
  NEON.red.forEach(p=>{g.fillStyle=rgb(mix([70,22,20],p.c,.35+.65*NEON.lv));g.fillRect(p.x,p.y,1,1)});

  /* pocas: brilho, reflexo e ondas */
  PUD.forEach(([x,y],i)=>{const s=Math.sin(t*1.7+x*.8+y*1.4+i*.3);
    if(s>.95){g.fillStyle='rgb(88,110,132)';g.fillRect(x,y,1,1)}else if(s<-.92){g.fillStyle='rgb(46,58,68)';g.fillRect(x,y,1,1)}
    if(x>=130&&x<=150){g.fillStyle=`rgba(255,70,140,${.3*NEON.lv*(.55+.45*Math.sin(t*3+x*.9))})`;g.fillRect(x,y,1,1)}
    if(x>=92&&x<=114&&(x+y)%2===0){g.fillStyle=`rgba(255,200,90,${.12+.08*Math.sin(t*2+x)})`;g.fillRect(x,y,1,1)}});
  LAMPS.forEach(L=>{for(let y=77;y<=89;y+=2){const xx=L.ax+Math.round(Math.sin(t*2.2+y*.9)*1.4);g.fillStyle=`rgba(255,205,110,${.20*L.lv*(1-(y-77)/16)})`;g.fillRect(xx-1,y,3,1)}});
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.a+=dt;if(r.a>1){ripples.splice(i,1);continue}
    const rr=r.a*7;g.fillStyle=`rgba(170,195,220,${(1-r.a)*.5})`;
    for(let k=0;k<18;k++){const an=k/18*6.283,xx=Math.round(r.x+Math.cos(an)*rr),yy=Math.round(r.y+Math.sin(an)*rr*.45);if(xx>=0&&xx<LW&&yy>=0&&yy<LH&&pm[yy*LW+xx])g.fillRect(xx,yy,1,1)}}

  /* vapor do bueiro */
  steamT+=dt;while(steamT>0){steamT-=.16;steam.push({x:79+R(-3,3),y:80,vx:R(-.8,1.2)+1.2,vy:-R(5,9),age:0,life:R(2.6,4.2)})}
  for(let i=steam.length-1;i>=0;i--){const s=steam[i];s.age+=dt;if(s.age>s.life){steam.splice(i,1);continue}
    s.x+=(s.vx+Math.sin(t*1.5+s.y*.3)*.8)*dt;s.y+=s.vy*dt;const k=s.age/s.life,sz=1+Math.floor(k*3.2);
    g.fillStyle=`rgba(150,164,180,${.34*(1-k)*Math.min(1,s.age*2.5)})`;g.fillRect(Math.round(s.x-sz/2),Math.round(s.y-sz/2),sz,sz)}

  /* papeis ao vento */
  paperT-=dt;if(paperT<=0){paperT=R(11,22);papers.push({x:-4,y:R(70,86),vx:R(20,32),hop:0,vy:0,ph:R(0,6)})}
  for(let i=papers.length-1;i>=0;i--){const p=papers[i];p.x+=p.vx*dt;p.vy+=60*dt;p.y+=p.vy*dt;
    if(p.y>p.gy){}
    if(!p.gy)p.gy=p.y;if(p.y>=p.gy){p.y=p.gy;p.vy=-R(14,24)}
    if(p.x>LW+4){papers.splice(i,1);continue}
    g.fillStyle='rgb(212,205,184)';const fl=Math.floor(t*8+p.ph)%2;g.fillRect(Math.round(p.x),Math.round(p.y),fl?2:1,fl?1:2)}

  /* pingos */
  DRIPS.forEach(d=>{d.t-=dt;
    if(d.state===0&&d.t<=0){d.state=1;d.yy=d.y;d.vy=0}
    if(d.state===1){d.vy+=95*dt;d.yy+=d.vy*dt;g.fillStyle='rgba(170,200,230,.85)';g.fillRect(d.x,Math.round(d.yy),1,Math.min(2,Math.round(d.vy/25)+1));
      if(d.yy>=d.land){d.state=0;d.t=R(1.2,4.5);for(let k=0;k<3;k++)splash.push({x:d.x,y:d.land-.5,vx:R(-8,8),vy:R(-18,-8),l:.25})}}});

  /* mariposas */
  moths.forEach(m=>{m.a+=dt*m.s*(1+Math.sin(t*3+m.ph)*.5);const x=Math.round(m.L.ax+Math.cos(m.a)*m.r),y=Math.round(m.L.ay+2+Math.sin(m.a*1.3)*m.r*.6);
    g.fillStyle=Math.floor(t*14+m.ph)%2?'rgba(240,232,200,.95)':'rgba(180,170,140,.7)';g.fillRect(x,y,1,1)});

  /* >>> AQUI ENTRAM OS PERSONAGENS (ENTIDADES) <<< */
  c3.clearRect(0,0,480,270);ENTIDADES.sort((a,b)=>a.y-b.y).forEach(e=>e.draw&&e.draw(c3,t,dt));

  /* chuva (canvas com pixel mais fino) */
  r2.clearRect(0,0,320,180);
  drops.forEach(d=>{d.y+=d.vy*dt;d.x+=d.vx*dt;if(d.y>=d.land){hit(d);respawn(d);return}
    const n=d.near?7:4;for(let i=0;i<n;i++){const X=Math.round(d.x*2+.22*i),Y=Math.round(d.y*2-i);if(X<0||X>=320||Y<0||Y>=180)continue;
      const lx=X/2,ly=Y/2;let lit=0;for(const L of LAMPS){if(ly>L.ay&&Math.abs(lx-L.ax)<(ly-L.ay)*.5+2&&ly<72){lit=L.lv;break}}
      const a=(d.near?.55:.26)*(1-i/(n+1));
      r2.fillStyle=lit?`rgba(255,238,175,${Math.min(.95,a*1.9*lit)})`:`rgba(${d.near?'205,222,242':'165,186,214'},${a})`;r2.fillRect(X,Y,1,1)}});
  for(let i=splash.length-1;i>=0;i--){const s=splash[i];s.l-=dt;if(s.l<=0){splash.splice(i,1);continue}s.vy+=140*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    r2.fillStyle='rgba(195,212,235,.65)';r2.fillRect(Math.round(s.x*2),Math.round(s.y*2),1,1)}

  /* ---------- luzes em alta resolucao ---------- */
  f.globalAlpha=1;f.globalCompositeOperation='source-over';f.fillStyle='#000';f.fillRect(0,0,800,450);
  f.globalCompositeOperation='lighter';

  const moonA=.30*(1-.85*cover);glow(GMOON,MOON.x,MOON.y,170,moonA);glow(GMOON,MOON.x,MOON.y,60,moonA*.9);

  wins.forEach(w=>{if(w.lv<.03)return;const cx=w.x+2.5,cy=w.y+3.5;
    if(w.tv)glow(GB,cx,cy,95,.55*w.lv*(.7+.3*Math.random()));
    else{glow(GW,cx,cy,78,.34*w.lv);glow(GW,cx,cy,30,.28*w.lv)}});

  LAMPS.forEach(L=>{
    glow(GL,L.ax,L.ay,70,.55*L.lv);glow(GL,L.ax,L.ay,26,.5*L.lv);
    /* cone de luz */
    const gr=f.createLinearGradient(0,L.ay*FS,0,72*FS);gr.addColorStop(0,`rgba(255,210,120,${.30*L.lv})`);gr.addColorStop(1,`rgba(255,200,110,${.03*L.lv})`);
    f.globalAlpha=1;f.fillStyle=gr;f.beginPath();f.moveTo(L.ax*FS-8,L.ay*FS);f.lineTo(L.ax*FS+8,L.ay*FS);f.lineTo((L.ax+L.hw)*FS,72*FS);f.lineTo((L.ax-L.hw)*FS,72*FS);f.closePath();f.fill();
    glow(GL,L.ax,72,95,.30*L.lv,16);glow(GL,L.ax,81,120,.22*L.lv,22)});

  glow(GP,138.5,43.5,130,.50*NEON.lv);glow(GP,138.5,43.5,48,.55*NEON.lv);
  glow(GP,139,86,130,.30*NEON.lv,22);glow(GP,139,74,95,.12*NEON.lv,28);

  const pul=.55+.45*Math.sin(t*1.8);
  mag.forEach(([x,y],i)=>{if(i%2===0)glow(GM,x+.5,y+.5,30,.20*(.5+.5*Math.sin(t*2.1+x*.15)))});
  cy.forEach(([x,y],i)=>{if(i%2===0)glow(GC,x+.5,y+.5,30,.17*(.5+.5*Math.sin(t*1.7+x*.2)))});

  /* nevoa baixa */
  for(let i=0;i<5;i++){const fxp=((i*61+t*(3+i*.9))%(LW+120))-60;glow(GF,fxp,80+Math.sin(t*.4+i)*3,190,.07,26)}

  /* relampago */
  nextBolt-=dt;if(nextBolt<=0){nextBolt=R(14,30);strike()}
  if(flash>0){flashT+=dt;const e=flashT;flash=e<.07?1:e<.13?.15:e<.2?.75:Math.max(0,.75*(1-(e-.2)/.55));
    f.globalAlpha=flash*.42;f.fillStyle='rgb(150,170,255)';f.fillRect(0,0,800,450)}
  f.globalAlpha=1;f.globalCompositeOperation='source-over';

  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* abre para o resto do jogo usar */
window.CENARIO={g,LW,LH,ENTIDADES,maicon,chao:{calcada:{y0:68,y1:74},rua:{y0:75,y1:89}}};
}
})();
