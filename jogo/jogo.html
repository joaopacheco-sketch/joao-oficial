const urls={};
function decodifica(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}
function urlDe(n){return urls[n]||(urls[n]=URL.createObjectURL(new Blob([decodifica(PARTES[n])],{type:'text/html;charset=utf-8'})))}
const v=document.getElementById('v'),cortina=document.getElementById('cortina');
function ir(n,semCortina){
  if(semCortina){v.src=urlDe(n);return}
  cortina.style.opacity=1;setTimeout(()=>{v.src=urlDe(n)},360)}
v.addEventListener('load',()=>{try{v.contentWindow.focus()}catch(e){}cortina.style.opacity=0});
addEventListener('message',e=>{if(e.data&&e.data.ir&&PARTES[e.data.ir])ir(e.data.ir)});
addEventListener('focus',()=>{try{v.contentWindow.focus()}catch(e){}});
ir('index',true);
</script>
