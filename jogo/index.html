  #titleGlow{background:#ffc83c;filter:blur(10px);mix-blend-mode:screen;animation:tglow 2.2s ease-in-out infinite}
  @keyframes tglow{0%,100%{opacity:.25}50%{opacity:.95}}
  #titleShine{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) -100% 0/60% 100% no-repeat;mix-blend-mode:overlay;animation:shine 3.6s ease-in-out infinite}
  @keyframes shine{0%{background-position:-60% 0}55%,100%{background-position:200% 0}}
  .spark{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%) rotate(45deg);
    background:#ffe27a;box-shadow:0 0 14px 6px rgba(255,200,60,.8);mix-blend-mode:screen;animation:spark 1.6s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:translate(-50%,-50%) rotate(45deg) scale(.2);opacity:.2}50%{transform:translate(-50%,-50%) rotate(225deg) scale(1);opacity:1}}

  /* janelas, luzes */
  .win{position:absolute;border-radius:3px;mix-blend-mode:screen;background:rgba(255,185,70,.5);box-shadow:0 0 22px 8px rgba(255,160,40,.45);animation:breathe 3s ease-in-out infinite}
  .win.blue{background:rgba(120,190,255,.4);box-shadow:0 0 20px 6px rgba(90,160,255,.4)}
  @keyframes breathe{0%,100%{opacity:.25}50%{opacity:.75}}
  .dim{position:absolute;background:rgba(14,8,34,.78);transition:opacity .08s;opacity:0;border-radius:3px}
  .lamp{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,200,110,.6),transparent 65%);animation:lamp 2.6s ease-in-out infinite}
  @keyframes lamp{0%,100%{opacity:.5}45%{opacity:1}50%{opacity:.6}55%{opacity:1}}
  .neon{position:absolute;mix-blend-mode:screen;border-radius:4px;animation:neon 3s steps(1) infinite}
  @keyframes neon{0%,40%,44%,100%{opacity:.9}42%,46%,48%{opacity:.1}}

  /* vinheta + scanlines */
  #fx{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);animation:flick 5s steps(1) infinite}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.88}95%{opacity:1}97%{opacity:.92}}

  /* ---------- MENU ---------- */
  #ui{position:absolute;inset:0}
  #panel{position:absolute;left:500px;top:446px;width:600px;height:320px;
    background:linear-gradient(180deg,rgba(18,10,44,.93),rgba(10,6,28,.96));
    border:4px solid #3a2a6a;box-shadow:0 0 0 4px #0b0620,0 0 40px rgba(255,170,50,.18),inset 0 0 40px rgba(0,0,0,.6);
    clip-path:polygon(0 12px,12px 12px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0 calc(100% - 12px));
    animation:panelIn .7s 1.6s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes panelIn{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
  #panel::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,200,90,.18)}

  .btn{position:absolute;left:575px;width:450px;height:92px;border:0;background:none;cursor:pointer;
    font-family:inherit;color:#fff;outline:none;opacity:0;animation:btnIn .6s cubic-bezier(.2,1.5,.4,1) forwards}
  #bJogar{top:493px;animation-delay:2.1s}
  #bSair{top:626px;animation-delay:2.35s}
  @keyframes btnIn{from{opacity:0;transform:translateX(-120px) scale(.6)}to{opacity:1;transform:none}}

  .inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:26px;
    background:linear-gradient(180deg,#241552,#150b36);border:4px solid #b9b3d6;border-radius:34px;
    box-shadow:0 0 0 3px #0b0620,inset 0 0 18px rgba(0,0,0,.7);font-size:30px;letter-spacing:2px;
    text-shadow:3px 3px 0 #000;transition:filter .15s,box-shadow .15s}
  .btn.gold .inner{border-color:#ffb82e;box-shadow:0 0 0 3px #0b0620,0 0 26px rgba(255,170,30,.85),inset 0 0 22px rgba(255,170,30,.25);animation:goldpulse 1.6s ease-in-out infinite}
  @keyframes goldpulse{0%,100%{box-shadow:0 0 0 3px #0b0620,0 0 14px rgba(255,170,30,.5),inset 0 0 14px rgba(255,170,30,.15)}50%{box-shadow:0 0 0 3px #0b0620,0 0 34px rgba(255,190,50,1),inset 0 0 26px rgba(255,170,30,.4)}}

  /* HOVER: cresce e diminui sem parar */
  .btn:hover,.btn:focus-visible{z-index:5;animation:btnIn 0s forwards,bounce .7s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  .btn:hover .inner,.btn:focus-visible .inner{filter:brightness(1.35);background:linear-gradient(180deg,#3a2278,#201050)}
  .btn.gold:hover .inner{box-shadow:0 0 0 3px #0b0620,0 0 50px rgba(255,200,60,1),inset 0 0 30px rgba(255,190,50,.55)}
  .btn:not(.gold):hover .inner{border-color:#fff;box-shadow:0 0 0 3px #0b0620,0 0 30px rgba(190,170,255,.9)}
  .btn:active{animation:btnIn 0s forwards !important;transform:scale(.94) !important}

  /* icones */
  .tri{width:0;height:0;border-left:30px solid #ffc22e;border-top:20px solid transparent;border-bottom:20px solid transparent;filter:drop-shadow(0 0 8px #ffb000);animation:tri 1s ease-in-out infinite}
  @keyframes tri{0%,100%{transform:translateX(-5px)}50%{transform:translateX(7px)}}
  .door{position:relative;width:26px;height:42px;background:#e9e6f5;border:3px solid #9d98c0;border-radius:3px}
  .door::after{content:"";position:absolute;right:3px;top:17px;width:5px;height:5px;background:#241552}
  .btn:hover .door{animation:doorw .5s steps(2) infinite}
  @keyframes doorw{50%{transform:skewY(-6deg)}}
  .orn{position:absolute;top:50%;width:46px;height:8px;background:#ffb82e;box-shadow:0 0 12px #ffb000;transform:translateY(-50%);animation:orn 1.2s ease-in-out infinite}
  .orn.l{left:-56px}.orn.r{right:-56px;animation-delay:.6s}
  @keyframes orn{0%,100%{opacity:.4;width:34px}50%{opacity:1;width:50px}}

  /* divisor de baixo (pulsa) */
  #diamond{position:absolute;left:800px;top:788px;width:22px;height:22px;background:#ffb82e;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 14px #ffb000;mix-blend-mode:screen;animation:dia 1.5s ease-in-out infinite;pointer-events:none}
  @keyframes dia{0%,100%{transform:translate(-50%,-50%) rotate(45deg) scale(.7)}50%{transform:translate(-50%,-50%) rotate(225deg) scale(1.2)}}

  /* tela de transicao */
  #overlay{position:absolute;inset:0;background:#05030c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#ffd86a;text-align:center;z-index:50;opacity:0;transition:opacity .5s}
  #overlay.show{display:flex}
  #overlay.on{opacity:1}
  #ovText{font-size:30px;line-height:1.7;text-shadow:0 0 18px #ffaa00}
  #bar{width:520px;height:34px;border:4px solid #ffb82e;padding:4px;box-shadow:0 0 20px rgba(255,170,30,.6)}
  #fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#ffc22e 0 16px,#ff9a1f 16px 20px)}

  /* ---------- TELA DE CARREGAMENTO ESTILO SUPER NINTENDO ---------- */

  #coins{position:absolute;left:50px;top:40px;font-size:30px;color:#ffd86a;text-shadow:4px 4px 0 #000}
  #hud{position:absolute;left:250px;top:672px;width:1100px;padding:22px 34px 18px;background:rgba(10,5,30,.9);border:6px solid #e9e6f5;color:#fff;
    box-shadow:0 0 0 6px #0b0620,10px 10px 0 6px rgba(0,0,0,.5)}
  #hudTop{display:flex;justify-content:space-between;font-size:34px;text-shadow:4px 4px 0 #000}
  #hudTxt{color:#ffd86a}
  #hudBar{height:58px;margin-top:18px;border:6px solid #8f88c8;background:#0b0620;padding:5px}
  #hudFill{height:100%;width:0;
    background:linear-gradient(180deg,rgba(255,255,255,.5) 0 22%,transparent 22% 100%),repeating-linear-gradient(90deg,#ff9a1f 0 21px,transparent 21px 25px)}
  #hudTip{margin-top:20px;font-size:18px;line-height:1.6;color:#cdbfff;min-height:30px}
  #sBack{display:none;position:absolute;right:50px;top:30px;font-family:inherit;font-size:18px;padding:16px 26px;background:#241552;color:#fff;border:4px solid #b9b3d6;cursor:pointer;z-index:2}
  #sBack:hover{animation:bounce .7s ease-in-out infinite;border-color:#ffb82e}
  .blink{animation:blinkk .7s steps(1) infinite}
  @keyframes blinkk{50%{opacity:0}}
  #snes.flash::before{content:"";position:absolute;inset:0;background:#fff;z-index:5;animation:flashh .5s steps(5) forwards}
  @keyframes flashh{from{opacity:1}to{opacity:0}}
</style>

 <div id="stage">

 </div>

<script>
/* ---------- escala para caber em qualquer tela ---------- */
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();

/* ---------- parallax com o mouse ---------- */
const world=document.getElementById('world');
addEventListener('mousemove',e=>{
  const x=(e.clientX/innerWidth-.5)*-18, y=(e.clientY/innerHeight-.5)*-10;
  world.style.transform=`scale(1.04) translate(${x}px,${y}px)`;
});

/* ---------- janelas piscando ---------- */
const layer=document.getElementById('winLayer');
const wins=[[100,310],[163,312],[38,400],[100,400],[38,485],[343,424],[343,515],[283,515],
 [1510,277],[1388,367],[1510,367],[1570,367],[1388,455],[1449,455],[1570,455],[1181,473],[1240,380,'b'],[1450,277,'b'],[403,424,'b'],[403,515,'b'],[163,490,'b'],[1243,473,'b'],[1510,455,'b']];
wins.forEach(([x,y,t])=>{
  const w=document.createElement('div');w.className='win'+(t?' blue':'');
  w.style.cssText=`left:${x-14}px;top:${y-20}px;width:28px;height:40px;animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*4}s`;
  layer.appendChild(w);
  const d=document.createElement('div');d.className='dim';
  d.style.cssText=`left:${x-14}px;top:${y-20}px;width:28px;height:40px`;layer.appendChild(d);
  (function blink(){setTimeout(()=>{
    d.style.opacity=1;setTimeout(()=>{d.style.opacity=0;if(Math.random()<.4)setTimeout(()=>{d.style.opacity=1;setTimeout(()=>d.style.opacity=0,120)},150)},150+Math.random()*500);
    blink()},2500+Math.random()*9000)})();
});
[[470,435],[1115,437],[425,540]].forEach(([x,y],i)=>{
  const l=document.createElement('div');l.className='lamp';l.style.left=x+'px';l.style.top=y+'px';l.style.animationDelay=(-i*.9)+'s';layer.appendChild(l)});
const shop=document.createElement('div');shop.className='win';shop.style.cssText='left:1105px;top:565px;width:210px;height:80px;border-radius:6px;animation-duration:2.4s';layer.appendChild(shop);
const n1=document.createElement('div');n1.className='neon';n1.style.cssText='left:25px;top:522px;width:112px;height:18px;background:#ff3fa4;box-shadow:0 0 26px 8px rgba(255,60,170,.8)';layer.appendChild(n1);
const n2=document.createElement('div');n2.className='neon';n2.style.cssText='left:1135px;top:500px;width:96px;height:14px;background:#3fd0ff;box-shadow:0 0 26px 8px rgba(60,200,255,.8);animation-delay:-1.3s';layer.appendChild(n2);

/* ---------- canvas: estrelas, fumaça, chuva, vaga-lumes, ondas ---------- */
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const R=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:90},()=>({x:R(0,1600),y:R(0,230),p:R(0,6.28),s:R(.8,2.2),sz:Math.random()<.2?4:2}));
const smoke=[];const rain=Array.from({length:140},()=>({x:R(0,1700),y:R(0,900),l:R(10,22),v:R(14,24)}));
const flies=Array.from({length:22},()=>({x:R(0,1600),y:R(250,700),a:R(0,6.28),v:R(.3,.9),p:R(0,6.28)}));
const embers=Array.from({length:30},()=>({x:R(0,1600),y:R(500,900),v:R(.4,1.3),p:R(0,6.28)}));
const ripples=[];
let t=0;
function frame(){
  t+=.016;c.clearRect(0,0,1600,900);
  // estrelas
  stars.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(t*s.s+s.p));c.fillStyle=`rgba(255,250,220,${a})`;c.fillRect(s.x,s.y,s.sz,s.sz);
    if(s.sz==4&&a>.8){c.fillRect(s.x-4,s.y+1,12,2);c.fillRect(s.x+1,s.y-4,2,12)}});
  // estrela cadente
  if(Math.random()<.002)shoot={x:R(200,1300),y:R(20,120),l:0};
  if(window.shoot){const s=shoot;s.l+=1;for(let i=0;i<14;i++){c.fillStyle=`rgba(255,255,255,${1-i/14})`;c.fillRect(s.x+s.l*14-i*10,s.y+s.l*5-i*4,4,4)}if(s.l>40)shoot=null}
  // fumaça da chaminé
  if(Math.random()<.35)smoke.push({x:805+R(-4,4),y:185,r:R(5,9),a:.5,dx:R(.2,.7)});
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.y-=1.1;p.x+=p.dx+Math.sin(p.y/18)*.5;p.r+=.18;p.a-=.0058;
    if(p.a<=0){smoke.splice(i,1);continue}
    c.fillStyle=`rgba(190,160,210,${p.a*.5})`;const q=Math.round(p.r/4)*4;c.fillRect(Math.round(p.x/4)*4,Math.round(p.y/4)*4,q,q)}
  // vaga-lumes / brasas douradas
  flies.forEach(f=>{f.a+=R(-.08,.08);f.x+=Math.cos(f.a)*f.v;f.y+=Math.sin(f.a)*f.v;
    if(f.x<0)f.x=1600;if(f.x>1600)f.x=0;if(f.y<240)f.y=700;if(f.y>740)f.y=250;
    const al=.3+.7*Math.abs(Math.sin(t*2+f.p));
    c.fillStyle=`rgba(255,220,100,${al*.25})`;c.fillRect(f.x-6,f.y-6,12,12);c.fillStyle=`rgba(255,240,150,${al})`;c.fillRect(f.x-2,f.y-2,4,4)});
  embers.forEach(e=>{e.y-=e.v;e.x+=Math.sin(t*2+e.p)*.6;if(e.y<420){e.y=900;e.x=R(0,1600)}
    c.fillStyle=`rgba(255,${150+Math.random()*80|0},40,${Math.max(0,(e.y-420)/480)})`;c.fillRect(e.x,e.y,3,3)});
  // chuva
  c.strokeStyle='rgba(170,190,255,.28)';c.lineWidth=2;c.beginPath();
  rain.forEach(r=>{c.moveTo(r.x,r.y);c.lineTo(r.x-r.l*.25,r.y+r.l);r.x-=3;r.y+=r.v;
    if(r.y>900||r.x<-20){ if(r.y>770&&r.y<880&&Math.random()<.5)ripples.push({x:r.x,y:R(780,870),r:2,a:.6}); r.y=R(-60,0);r.x=R(0,1700)}});
  c.stroke();
  // ondas na poça
  for(let i=ripples.length-1;i>=0;i--){const p=ripples[i];p.r+=.7;p.a-=.02;if(p.a<=0){ripples.splice(i,1);continue}
    c.strokeStyle=`rgba(200,220,255,${p.a})`;c.lineWidth=2;c.beginPath();c.ellipse(p.x,p.y,p.r*2.4,p.r*.7,0,0,6.28);c.stroke()}
  requestAnimationFrame(frame)
}
frame();

/* ---------- sons 8-bit ---------- */
let ac;function beep(f,d=.08,type='square',v=.06){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('mouseenter',()=>{beep(660,.07);setTimeout(()=>beep(880,.07),70)}));

/* ---------- ações ---------- */
const ov=document.getElementById('overlay'),txt=document.getElementById('ovText'),fill=document.getElementById('fill'),bar=document.getElementById('bar'),back=document.getElementById('back');
function showOv(){ov.classList.add('show');requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('on')))}
function hideOv(){ov.classList.remove('on');setTimeout(()=>ov.classList.remove('show'),500)}
document.getElementById('bJogar').onclick=()=>startSnes();
document.getElementById('bSair').onclick=()=>{
  [523,392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.14),i*100));
  txt.innerHTML='ATÉ A PRÓXIMA!';bar.style.display='none';back.style.display='block';showOv();
  setTimeout(()=>{try{window.close()}catch(e){}},1500);
};
back.onclick=hideOv;

/* teclado: setas + enter */
const btns=[document.getElementById('bJogar'),document.getElementById('bSair')];
addEventListener('keydown',e=>{
  if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const i=btns.indexOf(document.activeElement);btns[(i+(e.key=='ArrowDown'?1:-1)+2)%2].focus();beep(740,.06)}
});

/* =====================================================
   TELA DE CARREGAMENTO ESTILO SUPER NINTENDO
   ===================================================== */
const snes=document.getElementById('snes'),sc=document.getElementById('sc'),g=sc.getContext('2d');
const hudTxt=document.getElementById('hudTxt'),hudPct=document.getElementById('hudPct'),hudFill=document.getElementById('hudFill'),hudTip=document.getElementById('hudTip'),sBack=document.getElementById('sBack'),coinN=document.getElementById('coinN');
const W=320,H=180,HOR=80,K=60,K2=32,SP=1.0;
let sRun=false,sDone=false,sT0=0,sRaf=0,sDur=12000,coinCount=0,lastTip=-1;
const TIPS=['DICA: COLETE AS MOEDAS PARA GANHAR PONTOS!','SABIA? ESTA CIDADE NUNCA DORME...','DICA: A NOITE ESCONDE MUITOS SEGREDOS.','DICA: EXPLORE CADA RUA COM CALMA.','PREPARANDO O MUNDO PARA VOCE...','DICA: SEMPRE VOLTE PARA PEGAR O QUE FICOU.'];
const KEYS=[[0,0],[.12,.1],[.3,.36],[.45,.42],[.55,.43],[.66,.78],[.9,.94],[1,1]];
const prog=u=>{for(let i=1;i<KEYS.length;i++){if(u<=KEYS[i][0]){const a=KEYS[i-1],b=KEYS[i];return a[1]+(b[1]-a[1])*(u-a[0])/(b[0]-a[0])}}return 1};

/* ceu fixo (com dithering) + lua */
const skyC=document.createElement('canvas');skyC.width=W;skyC.height=H;
(function(){const s=skyC.getContext('2d');
  const cols=['#0a0620','#150a38','#22104e','#34165f','#4b1c6b','#6a2575','#8c3178','#b0407a'];
  for(let i=0;i<8;i++){const y0=Math.floor(i*HOR/8),y1=Math.floor((i+1)*HOR/8);s.fillStyle=cols[i];s.fillRect(0,y0,W,y1-y0);
    if(i<7){s.fillStyle=cols[i+1];for(let y=y1-5;y<y1;y++)for(let x=(y&1);x<W;x+=2)if(((y-(y1-5))*2+(x&1))<7||(y&1)==(x&1)&&y>=y1-3)s.fillRect(x,y,1,1)}}
  const mx=252,my=30;
  [[19,'rgba(255,230,160,.07)'],[16,'rgba(255,230,160,.12)']].forEach(([r,c])=>{s.fillStyle=c;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)s.fillRect(mx+x,my+y,1,1)});
  s.fillStyle='#f6e8b0';for(let y=-12;y<=12;y++)for(let x=-12;x<=12;x++)if(x*x+y*y<=144)s.fillRect(mx+x,my+y,1,1);
  s.fillStyle='#d6c488';[[-4,-5,3],[4,2,4],[-6,5,2],[2,-8,2]].forEach(([x,y,r])=>s.fillRect(mx+x,my+y,r,r));
})();
const sStars=Array.from({length:55},()=>({x:Math.random()*W|0,y:Math.random()*60|0,p:Math.random()*6.28,big:Math.random()<.15}));

/* cidade em duas camadas */
function mkCity(minH,maxH,minW,maxW,T){const a=[];let x=0;
  while(true){const w=Math.floor(R(minW,maxW));if(x+w>T)break;const h=Math.floor(R(minH,maxH));const win=[];
    for(let wx=3;wx<w-3;wx+=5)for(let wy=4;wy<h-3;wy+=6)win.push({dx:wx,dy:wy,on:Math.random()<.55,blue:Math.random()<.25,ph:Math.random()*100|0});
    a.push({x,w,h,win});x+=w+Math.floor(R(0,3))}
  return a}
const TW=360,cityFar=mkCity(22,58,18,34,TW),cityNear=mkCity(12,40,14,28,TW);
function drawCity(arr,off,col,t,bright){
  arr.forEach(b=>{const bx=(((b.x-off)%TW)+TW)%TW-40;if(bx>W||bx+b.w<0)return;
    g.fillStyle=col;g.fillRect(bx,HOR-b.h,b.w,b.h);
    b.win.forEach(w=>{let on=w.on;if(((w.ph+Math.floor(t*1.5))%13)==0)on=!on;if(!on)return;
      g.fillStyle=w.blue?'#6fb0ff':(bright?'#ffe9a0':'#ffc15a');g.fillRect(bx+w.dx,HOR-b.h+w.dy,2,3)})})}

/* chao Mode 7 */
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,f)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*f)).join(',')})`;
const P0=hx('#2d1560'),P1=hx('#1d0c42'),FG=hx('#8c3178'),rowA=[],rowB=[],rowM=[];
for(let k=1;k<=H-HOR;k++){const f=Math.max(0,1-k/34)*.85;rowA[k]=mixc(P0,FG,f);rowB[k]=mixc(P1,FG,f);rowM[k]=mixc(P0.map((v,i)=>(v+P1[i])/2),FG,f)}
function drawFloor(t){
  let prevZ=null;
  for(let y=HOR+1;y<H;y++){const k=y-HOR,d=K/k,wc=K2*k/K,zc=Math.floor(d-t*SP),par=((zc%2)+2)%2;
    if(wc<3){g.fillStyle=rowM[k];g.fillRect(0,y,W,1);prevZ=zc;continue}
    g.fillStyle=par?rowB[k]:rowA[k];g.fillRect(0,y,W,1);
    g.fillStyle=par?rowA[k]:rowB[k];
    const n0=Math.floor(-160/wc),n1=Math.ceil(160/wc);
    for(let n=n0;n<=n1;n++){if((((n%2)+2)%2)==1){const x0=Math.round(160+n*wc),x1=Math.round(160+(n+1)*wc);g.fillRect(x0,y,x1-x0,1)}}
    if(prevZ!==null&&zc!==prevZ&&k>3){g.fillStyle='rgba(255,120,200,.55)';g.fillRect(0,y,W,1)}
    prevZ=zc;
    if(k>6){g.fillStyle='rgba(255,140,200,.3)';for(let n=n0;n<=n1;n++)g.fillRect(Math.round(160+n*wc),y,1,1)}
  }}

/* heroi (14x20) com 2 frames */
const PAL={k:'#140a24',s:'#f2b98a',r:'#d8353a',R:'#8a1f2a',b:'#3a6fe0',B:'#23428f',w:'#ffffff'};
const HEAD=['....kkkkkk....','...krrrrrrk...','..krrrrrrrrk..','..kRRRRRRRRRk.','..kssssssssk..','..kssksssksk..','..kssssssssk..','...kssssssk...','....kkkkkk....','..kbbbbbbbbk..','.kbbbbbwbbbbk.','.ksbbbbbbbbsk.','..kbbbbbbbbk..','..kBBBBBBBBk..'];
const LEGS=[['..kBBk..kBBk..','.kBBk....kBBk.','.kBk......kBk.','kRRk......kRRk','kRRRk.....kRRk','.kkk.......kkk'],
            ['...kBBkkBBk...','....kBBBBk....','....kBBBBk....','....kRRRRk....','....kRRRRk....','.....kkkk.....']];
function drawHero(x,y,t){
  const fr=Math.floor(t*8)%2,rows=HEAD.concat(LEGS[fr]);y+=fr?-1:0;
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=r[i];if(c!=='.'){g.fillStyle=PAL[c];g.fillRect(x+i,y+j,1,1)}}});
  for(let i=0;i<6;i++){g.fillStyle=i%2?'#e08a1e':'#ffc93c';g.fillRect(x+2-i*2,y+9+Math.round(Math.sin(t*14-i)*1.6),2,2)}}
const coins=Array.from({length:28},(_,i)=>({d0:3+i*2,prev:99}));
const sparks=[];
function drawCoins(t){
  coins.forEach(c=>{const cur=(((c.d0-t*SP)%60)+60)%60;
    if(c.prev>=1.25&&cur<1.25&&sRun&&!sDone){coinCount++;coinN.textContent=String(coinCount).padStart(2,'0');beep(1319,.06);setTimeout(()=>beep(1760,.1),50);
      for(let i=0;i<7;i++)sparks.push({x:68,y:120,vx:R(-1.2,1.2),vy:R(-2,-.6),l:1})}
    c.prev=cur;if(cur<1.25)return;
    const y=HOR+K/cur;if(y>H)return;const x=160-3.6*K2/cur,s=Math.max(1,Math.round((K/cur)/11)),sq=Math.floor(t*6)%2?s:Math.max(1,s-1);
    g.fillStyle='#7a4a00';g.fillRect(Math.round(x-sq/2-1),Math.round(y-s-1),sq+2,s+2);
    g.fillStyle='#ffc93c';g.fillRect(Math.round(x-sq/2),Math.round(y-s),sq,s);
    if(s>2){g.fillStyle='#fff3a0';g.fillRect(Math.round(x-sq/2),Math.round(y-s),1,s-1)}})}

function drawScene(t){
  g.drawImage(skyC,0,0);
  sStars.forEach(s=>{if(Math.sin(t*2+s.p)>-.3){g.fillStyle='#fff';g.fillRect(s.x,s.y,1,1);if(s.big){g.fillRect(s.x-1,s.y,3,1);g.fillRect(s.x,s.y-1,1,3)}}});
  drawCity(cityFar,t*5,'#2a1250',t,false);drawCity(cityNear,t*12,'#150a30',t,true);
  drawFloor(t);drawCoins(t);
  g.fillStyle='rgba(0,0,0,.4)';g.fillRect(62,128,12,2);g.fillRect(64,130,8,1);
  drawHero(61,108,t);
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.l-=.04;if(p.l<=0){sparks.splice(i,1);continue}g.fillStyle=p.l>.5?'#fff3a0':'#ffc93c';g.fillRect(Math.round(p.x),Math.round(p.y),2,2)}
}

/* musica chiptune em loop */
let mus=null;
function startMusic(){stopMusic();
  const mel=[440,523,659,784,659,523,440,392,440,523,659,880,784,659,523,659],bass=[110,110,131,131,98,98,131,131];let i=0;
  mus=setInterval(()=>{beep(mel[i%16],.12,'square',.03);if(i%2==0)beep(bass[(i>>1)%8],.28,'triangle',.06);i++},170)}
function stopMusic(){clearInterval(mus);mus=null}

function sLoop(now){
  if(!sRun)return;
  const el=Math.max(0,now-sT0),t=el/1000;
  drawScene(t);
  if(!sDone){
    let u=Math.min(1,el/sDur),p=prog(u);const q=Math.floor(p*40)/40;
    hudFill.style.width=(q*100)+'%';hudPct.textContent=Math.floor(q*100)+'%';
    hudTxt.textContent='CARREGANDO'+'.'.repeat(Math.floor(t*2.5)%4);
    const ti=Math.floor(t/3)%TIPS.length;if(ti!==lastTip){lastTip=ti;hudTip.textContent=TIPS[ti]}
    if(u>=1)finishSnes();
  }
  sRaf=requestAnimationFrame(sLoop)}
function startSnes(){
  if(document.activeElement)document.activeElement.blur();
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*80));
  sDone=false;sRun=true;sDur=10000+Math.random()*5000;coinCount=0;coinN.textContent='00';lastTip=-1;sparks.length=0;coins.forEach(c=>c.prev=99);
  hudFill.style.width='0';hudPct.textContent='0%';hudTxt.textContent='CARREGANDO';hudTxt.classList.remove('blink');hudTip.classList.remove('blink');sBack.style.display='none';
  snes.classList.remove('flash');snes.classList.add('vis');void snes.offsetWidth;snes.classList.add('open');
  startMusic();sT0=performance.now();cancelAnimationFrame(sRaf);sRaf=requestAnimationFrame(sLoop)}
function finishSnes(){
  sDone=true;stopMusic();hudFill.style.width='100%';hudPct.textContent='100%';
  hudTxt.textContent='PRONTO!';hudTxt.classList.add('blink');hudTip.textContent='APERTE ENTER PARA COMECAR';hudTip.classList.add('blink');goT=setTimeout(goGame,2400);
  snes.classList.add('flash');[523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*90));
  }
let goT=0;
function goGame(){clearTimeout(goT);stopMusic();snes.classList.remove('open');setTimeout(()=>{if(parent!==window)parent.postMessage({ir:'cenario'},'*');else location.href='cenario.html'},950)}
function closeSnes(){clearTimeout(goT);stopMusic();snes.classList.remove('open');setTimeout(()=>{if(!snes.classList.contains('open')){sRun=false;cancelAnimationFrame(sRaf);snes.classList.remove('vis','flash')}},1000)}
sBack.onclick=closeSnes;
addEventListener('keydown',e=>{
  if(!sRun)return;
  if(sDone&&(e.key==='Enter'||e.key===' ')){e.preventDefault();goGame()}
  else if(e.key==='Escape'){e.preventDefault();closeSnes()}
});
</script>
