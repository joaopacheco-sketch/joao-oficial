<style>

  #hint{position:absolute;left:0;right:0;bottom:20px;text-align:center;color:#d9dcc8;font-size:19px;letter-spacing:1px;text-shadow:2px 2px 0 #000;opacity:0;animation:hint 9s 3.2s ease-in-out forwards;pointer-events:none}

  #snd{position:absolute;right:26px;top:22px;font-family:inherit;font-size:20px;color:#fff;background:rgba(10,10,20,.55);border:3px solid #8d93b5;padding:10px 16px;cursor:pointer;z-index:5}

  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const len=AC.sampleRate*4;noiseBuf=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=noiseBuf.getChannelData(ch);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.03*w)/1.03;d[i]=w*.4+l*6}}
  const loop=(rate,lpf,gain)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.playbackRate.value=rate;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lpf;const gn=AC.createGain();gn.gain.value=gain;s.connect(fl);fl.connect(gn);gn.connect(master);s.start();return gn};
  const roar=loop(.6,420,.22);

}
function hiss(dur){if(!AC||!soundOn)return;const t0=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4200;bp.Q.value=.6;
  const gn=AC.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(.16,t0+.12);gn.gain.setValueAtTime(.16,t0+dur*.7);gn.gain.exponentialRampToValueAtTime(.001,t0+dur);
  s.connect(bp);bp.connect(gn);gn.connect(master);s.start(t0,Math.random()*2);s.stop(t0+dur+.1)}

  const SW=33,SH=66,PAD=8,TWd=SW+PAD*2,THt=SH+PAD*2,CH=3;

  const MOVE=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.shift=e.shiftKey;if(MOVE.includes(k)){keys[k]=true;e.preventDefault()}});
  addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.shift=e.shiftKey;keys[k]=false});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
  const sF=new Image(),sB=new Image();sF.src=cfg.sprF;sB.src=cfg.sprB;
  const tmpc=document.createElement('canvas');tmpc.width=TWd;tmpc.height=THt;
  const tg=tmpc.getContext('2d');tg.imageSmoothingEnabled=false;
  const hair={x:0,y:0,vx:0,vy:0};
  const approach=(v,t,s)=>v<t?Math.min(t,v+s):Math.max(t,v-s);
  const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));

  const M={x:cfg.x0,y:cfg.y0,vx:0,vy:0,dir:'down',moving:false,running:false,skid:false,ph:0,walked:0,pf:0,speed:0,peak:0,dustT:0,prevBob:0,P:null,

  /* pose = deslocamentos de cada parte do corpo em cada instante do ciclo */
  pose(dir,ph,mv,run,t,skid){
    const side=dir==='left'||dir==='right';
    const cyc=ph*6.2832,sn=Math.sin(cyc),f=side?Math.cos(cyc):sn;
    const P={side,dL:0,dR:0,oxL:0,oxR:0,bob:0,lean:0,aLdx:0,aLdy:0,aRdx:0,aRdy:0};
    if(skid){P.lean=side?-1:0;if(side){P.oxL=-3;P.oxR=3;P.aLdx=-2;P.aRdx=2}P.aLdy=P.aRdy=-1;return P}
    if(!mv){P.bob=(Math.sin(t*2.2)>.35)?1:0;return P}
    const U=run?4.6:3,D=side?0:(run?1.6:1);
    P.dL=f>0?-Math.round(f*U):Math.round(-f*D);
    P.dR=f<0?-Math.round(-f*U):Math.round(f*D);
    if(side){const A=run?6.5:5;P.oxL=Math.round(sn*A);P.oxR=-P.oxL}
    P.bob=Math.round(Math.abs(f)*(run?2.4:1.4));
    P.lean=side?(run?2:1):0;
    if(side){P.aLdx=Math.round(-sn*(run?3:2));P.aRdx=-P.aLdx;P.aLdy=P.aRdy=run?-1:0}
    else{P.aLdy=Math.round(f*(run?2.4:1.4));P.aRdy=-P.aLdy}
    return P},

  passo(lado){
    if(cfg.onStep)cfg.onStep(this.x+lado*1.7,this.y,this.running,lado);
    stepSound(this.running,cfg.stepLP||[1100,1700])},

  update(t,dt){
    const lock=cfg.locked&&cfg.locked();
    let dx=0,dy=0;const k=keys;
    if(!lock){dx=((k.d||k.arrowright)?1:0)-((k.a||k.arrowleft)?1:0);dy=((k.s||k.arrowdown)?1:0)-((k.w||k.arrowup)?1:0)}
    const has=!!(dx||dy);
    if(has){const l=Math.hypot(dx,dy);dx/=l;dy/=l}
    const maxS=(k.shift&&!lock)?cfg.runSpd:cfg.walkSpd,st=(has?cfg.accel:cfg.decel)*dt;
    this.vx=approach(this.vx,has?dx*maxS:0,st);this.vy=approach(this.vy,has?dy*maxS:0,st);
    let nx=this.x+this.vx*dt,ny=this.y+this.vy*dt;const b=cfg.bounds;
    if(nx<b[0]){nx=b[0];this.vx=0}if(nx>b[1]){nx=b[1];this.vx=0}if(ny<b[2]){ny=b[2];this.vy=0}if(ny>b[3]){ny=b[3];this.vy=0}
    const moved=Math.hypot(nx-this.x,ny-this.y);this.x=nx;this.y=ny;
    this.speed=Math.hypot(this.vx,this.vy);
    this.moving=this.speed>4;
    this.running=this.speed>cfg.walkSpd+(cfg.runSpd-cfg.walkSpd)*.45;
    if(has){this.peak=Math.max(this.peak,this.speed);
      if(Math.abs(dx)>Math.abs(dy))this.dir=dx>0?'right':'left';else if(dy!==0)this.dir=dy>0?'down':'up';else this.dir=dx>0?'right':'left'}
    else if(this.speed<8)this.peak=0;
    this.skid=!has&&this.peak>cfg.walkSpd*1.25&&this.speed>10;
    if(this.moving&&!this.skid){
      this.ph=(this.ph+moved/(this.running?15:11.5))%1;this.walked+=moved;
      const side=this.dir==='left'||this.dir==='right',f=side?Math.cos(this.ph*6.2832):Math.sin(this.ph*6.2832);
      if(this.pf>0&&f<=0)this.passo(-1);else if(this.pf<0&&f>=0)this.passo(1);
      this.pf=f}
    else if(!this.moving){this.ph*=Math.max(0,1-dt*10);this.pf=0}
    if(this.skid){this.dustT-=dt;if(this.dustT<=0){this.dustT=.045;if(cfg.onSkid)cfg.onSkid(this.x,this.y,this.dir)}}
    const P=this.P=this.pose(this.dir,this.ph,this.moving&&!this.skid,this.running,t,this.skid);
    /* cabelo com mola: balanca e demora para acompanhar o corpo */
    const bobV=(P.bob-this.prevBob)/Math.max(dt,.001);this.prevBob=P.bob;
    const tx=P.side?(this.skid?1.5:-(this.speed/cfg.runSpd)*2.4):0,ty=clampN(bobV*.03,-2,2);
    hair.vx+=(-260*(hair.x-tx)-20*hair.vx)*dt;hair.x=clampN(hair.x+hair.vx*dt,-3,3);
    hair.vy+=(-260*(hair.y-ty)-20*hair.vy)*dt;hair.y=clampN(hair.y+hair.vy*dt,-3,3)},

  compose(dir,P){
    const img=dir==='up'?sB:sF;
    const tdx=Math.round(P.lean/2),tdy=-P.bob,hdx=P.lean,hdy=-P.bob;
    const hrx=hdx+Math.round(hair.x),hry=hdy+Math.round(hair.y);
    tg.globalCompositeOperation='source-over';tg.clearRect(0,0,TWd,THt);
    /* pernas */
    tg.drawImage(img,9,46,8,7,PAD+9+P.oxL,PAD+46+P.dL,8,7);
    tg.drawImage(img,0,53,17,13,PAD+P.oxL,PAD+53+P.dL,17,13);
    tg.drawImage(img,17,46,7,7,PAD+17+P.oxR,PAD+46+P.dR,7,7);
    tg.drawImage(img,17,53,16,13,PAD+17+P.oxR,PAD+53+P.dR,16,13);
    /* ombros, tronco e quadril */
    tg.drawImage(img,6,33,21,2,PAD+6+tdx,PAD+33+tdy,21,2);
    tg.drawImage(img,11,35,11,14,PAD+11+tdx,PAD+35+tdy,11,14);
    /* bracos */
    tg.drawImage(img,3,35,8,14,PAD+3+P.aLdx,PAD+35+P.aLdy+tdy,8,14);
    tg.drawImage(img,22,35,9,14,PAD+22+P.aRdx,PAD+35+P.aRdy+tdy,9,14);
    /* cabeca e cabelo */
    tg.drawImage(img,0,16,33,17,PAD+hdx,PAD+16+hdy,33,17);
    tg.drawImage(img,0,0,33,22,PAD+hrx,PAD+hry,33,22)},

  draw(c,t,dt){
    this.update(t,dt);
    if(!sF.complete||!sF.naturalWidth||!sB.complete||!this.P)return;
    const P=this.P;this.compose(this.dir,P);
    const tints=cfg.tint?cfg.tint(this.x,this.y,t):[];
    tg.globalCompositeOperation='source-atop';tints.forEach(s=>{tg.fillStyle=s;tg.fillRect(0,0,TWd,THt)});tg.globalCompositeOperation='source-over';
    const side=P.side,fx_=Math.round(this.x*CH),fy=Math.round(this.y*CH),sx=side?.8:1,flip=this.dir==='left'?-1:1;
    c.fillStyle=`rgba(0,0,0,${cfg.shadowA||.42})`;c.beginPath();c.ellipse(fx_,fy-1,Math.max(6,12*sx+1-P.bob*.5),3.4,0,0,6.2832);c.fill();
    if(cfg.reflect&&cfg.reflect(this.y)){c.save();c.globalAlpha=cfg.reflA||.17;c.setTransform(flip*sx,0,0,-.6,fx_,fy);c.drawImage(tmpc,-TWd/2,-(PAD+SH),TWd,THt);c.restore()}
    c.save();c.setTransform(flip*sx,0,0,1,fx_,fy);c.drawImage(tmpc,-TWd/2,-(PAD+SH));c.restore();
    if(cfg.nomeEl){cfg.nomeEl.style.left=(this.x*10)+'px';cfg.nomeEl.style.top=((this.y-SH/CH-3.2-P.bob*.1)*10)+'px'}}
  };
  window.__compose=(d,ph,mv,run,sk)=>{const P=M.pose(d,ph,mv,run,0,!!sk);M.compose(d,P);return tmpc.toDataURL()};
  return M;
}

const ENT=[];

  locked:()=>travado,stepLP:[1500,2300],
  onStep(x,y,run){const n=run?5:2;for(let i=0;i<n;i++)dust.push({x:x*2+R(-3,3),y:y*2-1,vx:R(-14,14),vy:-R(6,18),l:.5,a:0,s:2});

/* ---------- loop ---------- */

  crateT-=dt;if(crateT<=0){crateT=2.3;crates.push({x:62,hit:false})}
  g.save();g.beginPath();g.rect(73,50,25,16);g.clip();
  for(let i=crates.length-1;i>=0;i--){const c=crates[i];c.x+=12*dt;
    if(!c.hit&&c.x+12>=97){c.hit=true;burstSparks(101,58,12,60);clank();hiss(.5)}

  g.restore();

  /* engrenagem girando */
  {const a=t*.9,cx=96,cy=48.5,N=8;
   for(let y=36;y<=61;y++)for(let x=82;x<=110;x++){
     const dx=x+.5-cx,dy=y+.5-cy,r=Math.hypot(dx,dy);if(r>11.6)continue;
     let on=false;
     if(r<=8.6)on=true;else{const step=6.2832/N;let q=((Math.atan2(dy,dx)-a)%step+step)%step-step/2;if(Math.abs(q)*r<=1.9-(r-8.6)*.28)on=true}
     if(!on)continue;

     if(r<=3.6)col=[42,41,30];
     else if(r<=4.8)col=[88,89,82];
     else{ if(r>7.6&&lit>.45)col=[150,153,145];else if(lit<-.5&&r>6.5)col=[92,93,86];
       if(r>5.1&&r<7.1){for(let k=0;k<4;k++){let q=((Math.atan2(dy,dx)-a-k*1.5708)%6.2832+6.2832)%6.2832;if(q>3.14159)q-=6.2832;if(Math.abs(q)*r<1.25)col=[56,56,48]}}}
     g.fillStyle=rgb(col);g.fillRect(x,y,1,1)}

    g.fillStyle=`rgba(125,72,175,${.20*s})`;g.fillRect(x,y,1,1);g.fillStyle=`rgba(60,170,160,${.16*(1-s)})`;g.fillRect(x,y,1,1);
    if(x>=118){g.fillStyle=`rgba(255,120,40,${.26*FUR.fl*(.6+.4*Math.sin(t*3+x))})`;g.fillRect(x,y,1,1)}});

  DR.forEach(d=>{d.t-=dt;

      if(d.y>=d.land){d.st=0;d.t=R(1.5,4.5);for(let k=0;k<3;k++)sparks.push({x:d.x*2,y:d.land*2-1,vx:R(-14,14),vy:-R(10,26),l:.28,a:1})}}});

  /* personagem */
  c3.clearRect(0,0,480,270);ENT.sort((a,b)=>a.y-b.y).forEach(e=>e.draw(c3,t,dt));

  /* ---------- particulas ---------- */
  pt.clearRect(0,0,320,180);

  if(t>steamNext){steamNext=t+R(5,9);steamUntil=t+R(1.3,2.1);hiss(steamUntil-t)}
  const spawnS=(t<steamUntil)?26:2;
  for(let n=Math.random()*dt*spawnS*2;n>0;n-=1)steam.push({x:121+R(-3,3),y:58,vx:R(-5,9),vy:-R(18,34),l:R(1.1,2.2),a:0});
  for(let i=steam.length-1;i>=0;i--){const s=steam[i];s.a+=dt;if(s.a>s.l){steam.splice(i,1);continue}s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy*=.992;const k=s.a/s.l,sz=3+Math.floor(k*9);

  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.a+=dt;if(s.a>s.l){smoke.splice(i,1);continue}s.x+=(s.vx+Math.sin(t+i)*2)*dt;s.y+=s.vy*dt;const k=s.a/s.l,sz=5+Math.floor(k*16);
    pt.fillStyle=`rgba(86,82,78,${.55*(1-k)*Math.min(1,s.a*2)})`;pt.fillRect(Math.round(s.x-sz/2),Math.round(s.y-sz/2),sz,sz)}
  /* faiscas */

    const a=.55*Math.max(0,Math.sin(t*1.6+m.p))*Math.sin(m.v*3.1416);pt.fillStyle=`rgba(255,250,190,${a})`;pt.fillRect(Math.round(x0*2),Math.round(y0*2),1,1)});

    f.globalAlpha=1;f.fillStyle=gr;f.beginPath();f.moveTo((L.x-4)*FS,17*FS);f.lineTo((L.x+4)*FS,17*FS);f.lineTo((L.x+22)*FS,75*FS);f.lineTo((L.x-22)*FS,75*FS);f.closePath();f.fill();
    glow(GL,L.x,80,125,.14*L.lv,18)});
  /* fornalha */
  glow(GO,134,62,230,.52*FUR.fl,200);glow(GO,134,62,80,.7*FUR.fl);glow(GO,134,82,210,.30*FUR.fl,30);glow(GO,134,48,120,.12*FUR.fl);

  f.globalAlpha=1;f.globalCompositeOperation='source-over';

  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.CENARIO={g,LW,LH,maicon,ENT,chao:{y0:75,y1:89}};
}
